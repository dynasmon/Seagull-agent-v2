name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refact/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.9"

jobs:
  verify:
    name: source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: lint and static analysis
        run: make lint
      - name: dependency graph and checksums
        run: make mod-check
      - name: unit, architecture and compatibility suites
        run: make test
      - name: race detector
        run: make test-race
      - name: build the agent from this checkout alone
        run: |
          make build
          dist/seagull-agent -version

  fuzz:
    name: every fuzz target for a few seconds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz every target from its seeds and the inputs kept under testdata/fuzz
        run: make fuzz FUZZTIME=10s
      - name: gather the inputs that failed, to be kept under testdata/fuzz once fixed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/failed"
          git ls-files --others --exclude-standard -z -- ':(glob)**/testdata/fuzz/**' | while IFS= read -r -d '' found; do
            mkdir -p "$RUNNER_TEMP/failed/$(dirname "$found")"
            cp -- "$found" "$RUNNER_TEMP/failed/$found"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: failing-fuzz-inputs
          path: ${{ runner.temp }}/failed
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: debian package on ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      packaged: ${{ steps.packaged.outputs.packaged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: package the commit twice into the same bytes
        id: packaged
        run: |
          make package
          make package DIST=dist/again
          cmp dist/deb/*.deb dist/again/deb/*.deb
          cmp dist/deb/*.spdx.json dist/again/deb/*.spdx.json
          cd dist/deb
          sha256sum -- *.deb *.spdx.json
          echo "packaged=$(sha256sum -- *.deb *.spdx.json | tr '\n' ';')" >> "$GITHUB_OUTPUT"
      - name: package the commit again as a later release, to update the agent to
        run: make ahead
      - name: install the package, run it as a service, update it and remove it
        run: make native-gate

  reproduce:
    name: debian package rebuilt by another builder
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: golang:1.26.9-trixie@sha256:f06b7122f888680048afb247c4e5f49c0069eb6c4c1ccae0f3f4834527a8d22c
    outputs:
      packaged: ${{ steps.packaged.outputs.packaged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: package the commit as another account, elsewhere, under another clock, locale and umask
        id: packaged
        shell: bash
        run: |
          useradd --uid 4242 --create-home builder
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/.git"
          runuser -u builder -- env -i HOME=/home/builder PATH=/usr/local/go/bin:/usr/bin:/bin TZ=Pacific/Kiritimati LANG=C.UTF-8 GOTOOLCHAIN=local SOURCE="$GITHUB_WORKSPACE" \
            bash -euo pipefail -s <<'BUILD'
          umask 077
          git clone --quiet --no-local "$SOURCE" "$HOME/elsewhere/agent"
          make -C "$HOME/elsewhere/agent" package DIST="$HOME/elsewhere/dist" >&2
          BUILD
          cd /home/builder/elsewhere/dist/deb
          sha256sum -- *.deb *.spdx.json
          echo "packaged=$(sha256sum -- *.deb *.spdx.json | tr '\n' ';')" >> "$GITHUB_OUTPUT"

  reproducible:
    name: the same package from both builders
    needs: [package, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: compare what the two builders packaged
        env:
          PACKAGED: ${{ needs.package.outputs.packaged }}
          REPRODUCED: ${{ needs.reproduce.outputs.packaged }}
        run: |
          echo "ubuntu 24.04 runner:  $PACKAGED"
          echo "golang trixie image: $REPRODUCED"
          test -n "$PACKAGED"
          test "$PACKAGED" = "$REPRODUCED"

  vulnerabilities:
    name: vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: scan reachable dependencies
        run: make vulncheck
