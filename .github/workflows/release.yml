name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signature:
    name: release tag signature
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: fetch the tag as it was pushed, and main, which names who may sign it
        run: git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" +refs/heads/main:refs/remotes/origin/main
      - name: refuse a tag no signer of main signed
        run: make verify-tag TAG="$GITHUB_REF_NAME"

  ci:
    name: every job main requires, on the tagged commit
    needs: signature
    uses: ./.github/workflows/ci.yml

  codeql:
    name: the code analysis main requires, on the tagged commit
    needs: signature
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  soak:
    name: cite the weekly soak of a commit the tag holds
    needs: signature
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      cited: ${{ steps.cited.outputs.cited }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cited
        name: cite the newest weekly soak of main, at most eight days old, of a commit the tag holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow soak.yml --branch main --event schedule --status success \
            --limit 20 --json headSha,createdAt,url \
            --jq ".[] | select(.createdAt >= \"$since\") | \"\(.headSha) \(.createdAt) \(.url)\"" > "$RUNNER_TEMP/soaks"
          while read -r commit began url; do
            if git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
              echo "cited=$url, which soaked $commit from $began" >> "$GITHUB_OUTPUT"
              echo "cited $url, which soaked $commit from $began"
              exit 0
            fi
          done < "$RUNNER_TEMP/soaks"
          echo "no weekly soak of main since $since ran a commit the tag holds: tag again once one has" >&2
          exit 1

  package:
    name: package the tagged commit
    needs: signature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      packaged: ${{ steps.packaged.outputs.packaged }}
      toolchain: ${{ steps.packaged.outputs.toolchain }}
      platform: ${{ steps.platform.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: package the tagged commit
        id: packaged
        run: |
          make package
          built="$(dist/linux-amd64/seagull-agent -version | head -n 1 | cut -d ' ' -f 2)"
          if [ "$built" != "$GITHUB_REF_NAME" ]; then
            echo "the agent was built as $built, and the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          cd dist/deb
          sha256sum -- *.deb *.spdx.json
          echo "packaged=$(sha256sum -- *.deb *.spdx.json | tr '\n' ';')" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: name the backend commits the agent was verified against
        id: platform
        run: |
          verified="$(jq -r .commit tests/compatibility/testdata/*/platform.json | sort -u | paste -sd ' ')"
          test -n "$verified"
          echo "platform=$verified" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debian-package
          path: |
            dist/deb/*.deb
            dist/deb/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  reproduce:
    name: package the tagged commit on another builder
    needs: signature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: golang:1.26.10-trixie@sha256:a050dcceee6eb9bf110151662dfac7662f3bec40927c7dee48731e3d92083d42
    outputs:
      packaged: ${{ steps.packaged.outputs.packaged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: package the tagged commit as another account, elsewhere, under another clock, locale and umask
        id: packaged
        shell: bash
        run: |
          useradd --uid 4242 --create-home builder
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/.git"
          runuser -u builder -- env -i HOME=/home/builder PATH=/usr/local/go/bin:/usr/bin:/bin TZ=Pacific/Kiritimati LANG=C.UTF-8 GOTOOLCHAIN=local SOURCE="$GITHUB_WORKSPACE" \
            bash -euo pipefail -s <<'BUILD'
          umask 077
          git clone --quiet --no-local "$SOURCE" "$HOME/elsewhere/agent"
          make -C "$HOME/elsewhere/agent" package DIST="$HOME/elsewhere/dist" >&2
          BUILD
          cd /home/builder/elsewhere/dist/deb
          sha256sum -- *.deb *.spdx.json
          echo "packaged=$(sha256sum -- *.deb *.spdx.json | tr '\n' ';')" >> "$GITHUB_OUTPUT"

  release:
    name: attest the package and draft its release
    needs: [package, reproduce, ci, codeql, soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: debian-package
          path: dist/deb
      - id: held
        name: hold the package to what both builders packaged, what the native gate installed and what its bill of materials names
        env:
          PACKAGED: ${{ needs.package.outputs.packaged }}
          REPRODUCED: ${{ needs.reproduce.outputs.packaged }}
          GATED: ${{ needs.ci.outputs.packaged }}
        run: |
          echo "ubuntu 24.04 runner:  $PACKAGED"
          echo "golang trixie image: $REPRODUCED"
          echo "native gate:         $GATED"
          test -n "$PACKAGED"
          test "$PACKAGED" = "$REPRODUCED"
          test "$PACKAGED" = "$GATED"
          cd dist/deb
          test "$(sha256sum -- *.deb *.spdx.json | tr '\n' ';')" = "$PACKAGED"
          package="$(ls -- *.deb)"
          listed="$(ls -- *.spdx.json)"
          named="$(jq -r '.packages[] | select(.SPDXID == "SPDXRef-Package") | .checksums[] | select(.algorithm == "SHA256") | .checksumValue' "$listed")"
          test "$named" = "$(sha256sum "$package" | cut -d ' ' -f 1)"
          echo "package=dist/deb/$package" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/deb/$listed" >> "$GITHUB_OUTPUT"
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.held.outputs.package }}
      - id: materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.held.outputs.package }}
          sbom-path: ${{ steps.held.outputs.sbom }}
      - name: verify the package as an operator does, and refuse a changed one
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.held.outputs.package }}
          SBOM: ${{ steps.held.outputs.sbom }}
        run: |
          verify() {
            gh attestation verify "$@" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          }
          verify "$PACKAGE"
          verify "$PACKAGE" --predicate-type https://spdx.dev/Document/v2.3 --format json > "$RUNNER_TEMP/verified.json"
          jq -S '[.. | objects | select(.predicateType? == "https://spdx.dev/Document/v2.3")][0].predicate' "$RUNNER_TEMP/verified.json" > "$RUNNER_TEMP/attested.spdx.json"
          diff <(jq -S . "$SBOM") "$RUNNER_TEMP/attested.spdx.json"
          changed="$RUNNER_TEMP/$(basename "$PACKAGE")"
          cp "$PACKAGE" "$changed"
          printf '\0' >> "$changed"
          if verify "$changed"; then
            echo "a package whose bytes changed verifies" >&2
            exit 1
          fi
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.held.outputs.package }}
          SBOM: ${{ steps.held.outputs.sbom }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          MATERIALS: ${{ steps.materials.outputs.bundle-path }}
          TOOLCHAIN: ${{ needs.package.outputs.toolchain }}
          PLATFORM: ${{ needs.package.outputs.platform }}
          SOAK: ${{ needs.soak.outputs.cited }}
        run: |
          name="$(basename "$PACKAGE")"
          listed="$(basename "$SBOM")"
          served="${name//\~/.}"
          cp "$PROVENANCE" "$PACKAGE.sigstore.json"
          cp "$MATERIALS" "$PACKAGE.spdx.sigstore.json"
          cat > notes.md <<EOF
          Seagull Agent $GITHUB_REF_NAME, packaged for Ubuntu 24.04 on amd64.

          It claims the Core profile with inventory, process visibility, security configuration assessment and fleet management: signed policy, status, signed updates and rollouts. File integrity monitoring and network visibility are not claimed, since the backend keeps neither canonically yet, and neither are response actions.

          Verify the package before installing it:

              gh attestation verify $served --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF --source-digest $GITHUB_SHA --deny-self-hosted-runners

          The same command with --predicate-type https://spdx.dev/Document/v2.3 verifies ${listed//\~/.}, the bill of materials of what the package holds.

          Two builders packaged commit $GITHUB_SHA into these same bytes, and make package at $GITHUB_REF_NAME, with $TOOLCHAIN, writes them again.

          Before the release was drafted, that commit passed every job main requires, the native gate installed these same bytes, and the weekly soak of a commit it holds was cited: $SOAK.

          It was verified against Seagull backend $PLATFORM: every answer that commit records for an agent, and what its pipeline keeps and decides of what this agent sends. The backend has no release gate of its own yet, so the commit is named rather than a version.

          The README says how to install, configure and enroll it.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "$PACKAGE" "$PACKAGE.sigstore.json" "$SBOM" "$PACKAGE.spdx.sigstore.json"
