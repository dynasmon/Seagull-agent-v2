name: soak

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: how long the soak runs the installed agent, from 40m to 5h
        default: 4h
        required: true

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.9"

jobs:
  soak:
    name: the installed agent for hours, with every module, while the platform comes and goes
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: package the commit
        run: make package
      - name: install the package and run it for hours, holding its goroutines, descriptors and memory to what they settled at
        env:
          SOAK: ${{ inputs.duration || '4h' }}
        run: |
          if [[ ! "$SOAK" =~ ^([1-5]h|[4-9][0-9]m|[1-2][0-9][0-9]m|300m)$ ]]; then
            echo "a soak runs from 40m to 5h, such as 4h or 90m, and not for $SOAK" >&2
            exit 1
          fi
          make soak SOAK="$SOAK" EVIDENCE=dist/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: soak
          path: dist/evidence/footprint
          if-no-files-found: ignore
          retention-days: 90
